name: CI

on:
  push:
    branches:
      - main
    paths: &ci_paths
      - src/**
      - tests/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/ci.yml
      - .github/workflows/quality.yml
  pull_request:
    branches:
      - main
    paths: *ci_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
