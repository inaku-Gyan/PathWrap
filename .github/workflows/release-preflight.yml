name: Release preflight

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: Shared quality checks
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  preflight:
    name: Build and stage portable package
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release preparation helpers
        shell: pwsh
        run: ./scripts/release/prepare.ps1 -Mode SelfTest

      - name: Validate release tag and package version
        shell: pwsh
        run: ./scripts/release/prepare.ps1 -Mode Validate -Tag $env:GITHUB_REF_NAME

      - name: Build release binary
        shell: pwsh
        run: |
          $targetDirectory = Join-Path $env:RUNNER_TEMP 'pathwarp-release-target'
          if (Test-Path -LiteralPath $targetDirectory) {
            Remove-Item -LiteralPath $targetDirectory -Recurse -Force
          }
          $env:CARGO_TARGET_DIR = $targetDirectory
          cargo build --locked --release --bin PathWarp
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Stage portable package and checksum
        shell: pwsh
        run: |
          $targetDirectory = Join-Path $env:RUNNER_TEMP 'pathwarp-release-target'
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'pathwarp-release-artifacts'
          ./scripts/release/prepare.ps1 -Mode Package -Tag $env:GITHUB_REF_NAME -TargetDirectory $targetDirectory -OutputDirectory $artifactDirectory

      - name: Record build provenance
        shell: pwsh
        run: |
          $runnerImage = (@($env:ImageOS, $env:ImageVersion) | Where-Object { $_ }) -join ' '
          if ([string]::IsNullOrWhiteSpace($runnerImage)) {
            $runnerImage = "$env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          $rustVersion = rustc --version
          @"
          ## Release preflight
          - Commit SHA: $env:GITHUB_SHA
          - Tag: $env:GITHUB_REF_NAME
          - Rust/toolchain: $rustVersion
          - Target: $env:RELEASE_TARGET
          - Runner: $runnerImage
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload candidate release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PathWarp-${{ github.ref_name }}-windows-x64
          path: |
            ${{ runner.temp }}/pathwarp-release-artifacts/*.zip
            ${{ runner.temp }}/pathwarp-release-artifacts/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download verified candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: PathWarp-${{ github.ref_name }}-windows-x64
          path: ${{ runner.temp }}/pathwarp-release-artifacts

      - name: Validate release publication helpers
        shell: pwsh
        run: ./scripts/release/publish.ps1 -Mode SelfTest

      - name: Verify candidate checksum
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'pathwarp-release-artifacts'
          $zipName = "PathWarp-$env:GITHUB_REF_NAME-windows-x64.zip"
          ./scripts/release/prepare.ps1 -Mode Verify `
            -ZipPath (Join-Path $artifactDirectory $zipName) `
            -ChecksumPath (Join-Path $artifactDirectory "$zipName.sha256")

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'pathwarp-release-artifacts'
          ./scripts/release/publish.ps1 -Mode Publish -Tag $env:GITHUB_REF_NAME -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA -ArtifactDirectory $artifactDirectory
